apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-ingressroute
  namespace: tp-app
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`app.k3s.local`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: api-svc
          port: 3000
    - match: Host(`app.k3s.local`)
      kind: Rule
      services:
        - name: frontend-svc
          port: 80
