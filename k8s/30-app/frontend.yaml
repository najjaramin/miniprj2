apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-conf
  namespace: tp-app
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
      }
      location /api/ {
        proxy_pass http://api-svc:3000/;
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: tp-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appdb
      tier: frontend
  template:
    metadata:
      labels:
        app: appdb
        tier: frontend
    spec:
      serviceAccountName: frontend-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: tp-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: cache
              mountPath: /tmp
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: conf
          configMap:
            name: frontend-conf
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: tp-app
spec:
  selector:
    app: appdb
    tier: frontend
  ports:
    - port: 80
      targetPort: 8080
