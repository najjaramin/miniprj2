<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tâches</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
    li { margin: .3rem 0; }
    .faite { text-decoration: line-through; color: #888; }
    #status { font-size: .8rem; color: #666; }
  </style>
</head>
<body>
  <h1>Mes tâches</h1>
  <p id="status">…</p>
  <form id="form">
    <input id="titre" placeholder="Nouvelle tâche" required>
    <button>Ajouter</button>
  </form>
  <ul id="liste"></ul>
  <script>
    const $ = s => document.querySelector(s);
    async function rafraichir() {
      try {
        const r = await fetch('/api/taches');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const taches = await r.json();
        $('#liste').innerHTML = taches.map(t => `
          <li class="${t.faite ? 'faite' : ''}" data-id="${t.id}">
            ${t.titre}
            <button data-act="toggle">${t.faite ? 'retour' : 'ok'}</button>
            <button data-act="del">x</button>
          </li>`).join('');
        $('#status').textContent = taches.length + ' tache(s)';
      } catch (e) { $('#status').textContent = 'Erreur : ' + e.message; }
    }
    $('#form').addEventListener('submit', async e => {
      e.preventDefault();
      const titre = $('#titre').value.trim();
      if (!titre) return;
      await fetch('/api/taches', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titre: titre }),
      });
      $('#titre').value = '';
      rafraichir();
    });
    $('#liste').addEventListener('click', async e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const id = btn.closest('li').dataset.id;
      if (btn.dataset.act === 'del') {
        await fetch('/api/taches/' + id, { method: 'DELETE' });
      } else {
        const faite = !btn.closest('li').classList.contains('faite');
        await fetch('/api/taches/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ faite: faite }),
        });
      }
      rafraichir();
    });
    rafraichir();
    setInterval(rafraichir, 5000);
  </script>
</body>
</html>
